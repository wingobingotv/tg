services:
  miniapp:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Build-time only (native-tone translations). Everything else in .env
        # is read at container start by deploy/nginx/05-runtime-config.envsh.
        OPENAI_API_KEY: ${OPENAI_API_KEY:-}
        OPENAI_TRANSLATE_MODEL: ${OPENAI_TRANSLATE_MODEL:-}
    image: wingobingo-telegram:latest
    container_name: wingobingo-telegram
    restart: unless-stopped
    # Listed one by one instead of env_file, so build-only secrets such as
    # OPENAI_API_KEY never reach the running container. Compose reads them
    # from .env; the start script validates them.
    environment:
      PLAYER_API_URL: ${PLAYER_API_URL:-}
      SITE_URL: ${SITE_URL:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_MINIAPP_SHORT_NAME: ${TELEGRAM_MINIAPP_SHORT_NAME:-}
      DEFAULT_LANG: ${DEFAULT_LANG:-en}
      DEBUG_TELEMETRY_URL: ${DEBUG_TELEMETRY_URL:-}
      DEBUG_TELEMETRY_KEY: ${DEBUG_TELEMETRY_KEY:-}
      RECAPTCHA_V3_SITE_KEY: ${RECAPTCHA_V3_SITE_KEY:-}
    ports:
      - "${MINIAPP_BIND:-127.0.0.1}:${MINIAPP_PORT:-7400}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
